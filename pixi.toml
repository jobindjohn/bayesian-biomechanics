[workspace]
name = "bayesian-biomechanics"
description = "An interactive textbook on Bayesian approaches in biomechanics"
authors = ["Jobin John"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]
requires-pixi = ">=0.81"

[activation.env]
# Windows consoles otherwise crash on progress-bar characters
PYTHONUTF8 = "1"

# Policy: PyPI first. Conda only for things not available on PyPI.
[dependencies]
python = ">=3.12,<3.15"
graphviz = "*" # Graphviz binary for model graphs (not on PyPI)

[pypi-dependencies]
pymc = ">=6.3"
bambi = ">=0.21"
nutpie = ">=0.16"
arviz = ">=1.3"
marimo = ">=0.25"
numpy = ">=2.0"
scipy = ">=1.14"
polars = ">=2.0"
matplotlib = ">=3.9"
plotnine = ">=0.14"
h5netcdf = { version = ">=1.4", extras = ["h5py"] } # NetCDF results files

[tasks]
# Open a lesson notebook in marimo, e.g. `pixi run lesson 01-intro/grid_approximation.py`
lesson = { cmd = "marimo edit {{ notebook }}", args = ["notebook"] }
# Refit a lesson's models and overwrite its committed results
refit = { cmd = "python {{ notebook }}", args = ["notebook"], env = { BB_REFIT = "1" } }

[feature.dev.dependencies]
lychee = "*" # link checker (not on PyPI)

[feature.dev.pypi-dependencies]
ruff = ">=0.17"
typos = ">=1.51"
uv = ">=0.11" # runs notebooks standalone from their PEP 723 headers

[feature.dev.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
marimo-check = "marimo check --strict --ignore-scripts ."
spell = "typos"
sizes = "python scripts/check_sizes.py"
check = { depends-on = ["lint", "format-check", "marimo-check", "spell", "sizes"] }
install-hooks = "python scripts/install_hooks.py"
# Run each notebook standalone from its own header (uv / pixi --script)
check-notebooks = "python scripts/check_notebooks.py"

[feature.docs.dependencies]
quarto = ">=1.9.38,<1.10"

[feature.docs.tasks]
render = "quarto render"
preview = "quarto preview"
# Internal links only (fast, for PRs); links-all also checks external links
links = "lychee --no-progress --offline --root-dir $PIXI_PROJECT_ROOT/_site '_site/**/*.html'"
links-all = "lychee --no-progress --root-dir $PIXI_PROJECT_ROOT/_site '_site/**/*.html'"

[environments]
default = { solve-group = "main" }
dev = { features = ["dev"], solve-group = "main" }
docs = { features = ["docs", "dev"], solve-group = "main" }
