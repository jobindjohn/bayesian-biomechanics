name: Check

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC: all OSes + external links

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  PIXI_VERSION: v0.81.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: dev
          locked: true
      - run: pixi run -e dev check

  notebooks:
    # Each notebook runs standalone from its own PEP 723 header.
    # PRs: Linux only. Weekly: Linux, Windows and macOS.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: dev
          locked: true
      - run: pixi run -e dev check-notebooks

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: docs
          locked: true
      - run: pixi run -e docs render
      - name: Check internal links
        run: pixi run -e docs links
      - name: Check all links (weekly)
        if: github.event_name == 'schedule'
        run: pixi run -e docs links-all
