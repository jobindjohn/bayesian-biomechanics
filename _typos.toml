[files]
extend-exclude = ["pixi.lock", "LICENSE*", "_freeze/", "_site/", "_extensions/", "*.bib", "*.csl"]

# Prose is British English; code keeps the default locale so that
# library APIs (e.g. `color=`, `normalize`) are not flagged.
[type.qmd]
extend-glob = ["*.qmd"]
locale = "en-gb"
extend-ignore-re = [
    "(?s)```.*?```", # fenced code blocks
    "`[^`\n]+`", # inline code
]

[type.md]
locale = "en-gb"
extend-ignore-re = [
    "(?s)```.*?```", # fenced code blocks
    "`[^`\n]+`", # inline code
]

[default.extend-words]
lik = "lik" # log_lik: likelihood
